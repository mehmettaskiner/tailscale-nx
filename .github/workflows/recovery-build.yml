name: Recovery test build

on:
  workflow_dispatch:
  push:
    branches: ['fix/network-socket-recovery']

permissions:
  contents: read

jobs:
  host-tests:
    if: github.repository == 'mehmettaskiner/tailscale-nx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install host Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check native sanitizer runtime
        run: |
          clang --version
          printf '#include <stdio.h>\nint main(void) { puts("sanitizer runtime OK"); return 0; }\n' > /tmp/sanitizer-smoke.c
          clang -fsanitize=address,undefined /tmp/sanitizer-smoke.c -o /tmp/sanitizer-smoke
          timeout --kill-after=5s 30s /tmp/sanitizer-smoke
      - name: Run host regression tests with sanitizers
        run: timeout --kill-after=5s 480s make host-test CC=clang

  build:
    needs: host-tests
    if: github.repository == 'mehmettaskiner/tailscale-nx'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Build pinned Switch toolchain image
        run: make docker-image
      - name: Build sysmodule and check memory budget
        run: make sysmodule
      - name: Record source and binary checksum
        run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum switch/sysmodule/dist/atmosphere/contents/4200000000005453/exefs.nsp > binary-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-nx-recovery-test
          if-no-files-found: error
          path: |
            switch/sysmodule/dist/atmosphere/contents/4200000000005453/exefs.nsp
            switch/sysmodule/tailscale-nx.elf
            switch/sysmodule/tailscale-nx.map
            switch/sysmodule/source/heap_size.h
            source-commit.txt
            binary-sha256.txt
